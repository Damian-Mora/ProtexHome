<!-- Login -->
<form id="login-form" class="auth-form" novalidate>
  <div class="input-group">
    <label for="login-email">Correo electrónico</label>
    <div class="input-wrapper">
      <span class="material-symbols-outlined input-icon">mail</span>
      <input type="email" id="login-email" class="auth-input" 
             placeholder="correo@ejemplo.com" autocomplete="email" required>
      <span class="input-focus-border"></span>
    </div>
    <span class="input-error" id="login-email-error"></span>
  </div>
  
  <div class="input-group">
    <label for="login-password">Contraseña</label>
    <div class="input-wrapper">
      <span class="material-symbols-outlined input-icon">lock</span>
      <input type="password" id="login-password" class="auth-input" 
             placeholder="••••••••" autocomplete="current-password" required>
      <button type="button" class="toggle-password" id="toggle-login-password">
        <span class="material-symbols-outlined">visibility</span>
      </button>
      <span class="input-focus-border"></span>
    </div>
    <span class="input-error" id="login-password-error"></span>
  </div>
  
  <div class="form-options">
    <label class="checkbox-label">
      <input type="checkbox" id="remember-me">
      <span class="checkbox-custom"></span>
      <span>Recordarme</span>
    </label>
    <button type="button" class="link-button" id="forgot-password-btn">
      ¿Olvidaste tu contraseña?
    </button>
  </div>
  
  <div class="auth-error" id="login-error"></div>
  
  <button type="submit" class="auth-button primary-button" id="login-submit">
    <span class="button-text">Iniciar Sesión</span>
    <span class="button-loader" style="display: none;">
      <span class="loader"></span>
    </span>
  </button>
</form>

<div class="auth-divider">
  <span>o continuar con</span>
</div>

<button class="auth-button google-button" id="google-login-btn">
  <svg class="google-icon" viewBox="0 0 24 24">

    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>

</button>

<p class="auth-switch">
  ¿No tienes una cuenta? 
  <button type="button" class="link-button" id="switch-to-register">Regístrate</button>
</p>
