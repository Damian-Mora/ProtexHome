<!-- Vista Alarma DSC -->

<!-- OVERLAY DE CARGA (Loader tipo Facebook) -->
<div id="dsc-loading-overlay" style="
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 99999;
  transition: opacity 0.4s ease;
">
    <!-- Loader de 3 puntos estilo Facebook -->
    <div class="facebook-loader" style="
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: center;
  ">
        <div class="dot" style="
      width: 12px;
      height: 12px;
      background: #1877f2;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    "></div>
        <div class="dot" style="
      width: 12px;
      height: 12px;
      background: #1877f2;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
      animation-delay: 0.16s;
    "></div>
        <div class="dot" style="
      width: 12px;
      height: 12px;
      background: #1877f2;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
      animation-delay: 0.32s;
    "></div>
    </div>
</div>

<!-- Definición de la animación -->
<style>
    @keyframes bounce {

        0%,
        80%,
        100% {
            transform: scale(0);
            opacity: 0.5;
        }

        40% {
            transform: scale(1);
            opacity: 1;
        }
    }
</style>

<!-- CONTENIDO PRINCIPAL (oculto hasta que se cargue) -->
<div id="dsc-content" class="device-container fade-in" style="opacity:0;">

    <!-- Header -->
    <div class="device-header">
        <button class="dash-icon-btn" id="back-to-dashboard">
            <span class="material-symbols-outlined">arrow_back</span>
        </button>
        <h2 id="device-name">Alarma DSC</h2>
        <div class="device-header-actions">
            <div class="device-status-badge" id="device-status-badge">
                <span class="status-dot online"></span>
                <span>En línea</span>
            </div>
            <button class="dash-icon-btn" id="device-menu-btn">
                <span class="material-symbols-outlined">more_vert</span>
            </button>
        </div>
    </div>

    <!-- Contenido -->
    <div class="device-body">

        <!-- Selector de partición -->
        <div class="dsc-partition-selector" id="partition-selector-container">
            <label for="partition-select">Partición</label>
            <select id="partition-select" class="dsc-select">
                <option value="1" selected>Partición 1</option>
                <option value="2">Partición 2</option>
                <option value="3">Partición 3</option>
                <option value="4">Partición 4</option>
                <option value="5">Partición 5</option>
                <option value="6">Partición 6</option>
                <option value="7">Partición 7</option>
                <option value="8">Partición 8</option>
            </select>
        </div>

        <!-- Estado de partición -->
        <div class="dsc-partition-card compact">
            <div class="dsc-partition-header">
                <span class="material-symbols-outlined">security</span>
                <div>
                    <h3 id="partition-name">Partición 1</h3>
                    <p id="partition-state">Desarmado</p>
                </div>
            </div>
            <span class="dsc-led" id="partition-led"></span>
        </div>

        <!-- Botones de control -->
        <div class="dsc-controls-row">
            <button class="dsc-action-btn dsc-away" id="btn-arm-away">
                <span class="material-symbols-outlined">lock_person</span>
                <span class="dsc-action-label">Ausente</span>
            </button>
            <button class="dsc-action-btn dsc-home" id="btn-arm-home">
                <span class="material-symbols-outlined">home</span>
                <span class="dsc-action-label">En Casa</span>
            </button>
            <button class="dsc-action-btn dsc-disarm" id="btn-disarm">
                <span class="material-symbols-outlined">lock_open</span>
                <span class="dsc-action-label">Desarmar</span>
            </button>
        </div>

        <!-- Pestañas Historial / Zonas (orden cambiado) -->
        <div class="dsc-tabs">
            <button class="dsc-tab active" id="tab-historial">Historial</button>
            <button class="dsc-tab" id="tab-zonas">Zonas</button>
        </div>

        <!-- Contenedor de Historial (visible por defecto) -->
        <div id="panel-historial" class="dsc-panel">
            <div id="history-list" class="history-list">
                <p style="color:var(--text-light);text-align:center;">Cargando historial...</p>
            </div>
        </div>

        <!-- Contenedor de Zonas (oculto por defecto) -->
        <div id="panel-zonas" class="dsc-panel" style="display:none;">
            <div id="zones-list" class="zones-list">
                <p style="color:var(--text-light);text-align:center;">Cargando zonas...</p>
            </div>
        </div>
    </div>

    <!-- Modal Configuración (existente) -->
    <div class="modal-overlay" id="device-settings-modal" style="display:none;">
        <div class="modal-content">
            <h3>Configuración</h3>
            <div class="modal-input-group">
                <label>Nombre del dispositivo</label>
                <input type="text" id="edit-device-name" class="modal-input">
            </div>
            <div class="device-info-mini">
                <p><strong>Serial:</strong> <span id="info-serial">--</span></p>
                <p><strong>Tipo:</strong> Alarma DSC</p>
                <p><strong>Rol:</strong> <span id="info-role">--</span></p>
            </div>
            <button class="modal-btn primary" id="save-device-name">
                <span class="material-symbols-outlined">save</span>
                Guardar Cambios
            </button>
            <button class="modal-btn" id="share-device-btn">
                <span class="material-symbols-outlined">share</span>
                Compartir Sitio
            </button>
            <button class="modal-btn" id="unsubscribe-btn">
                <span class="material-symbols-outlined">notifications_off</span>
                Quitar notificaciones
            </button>
            <button class="modal-btn danger" id="delete-device-btn">
                <span class="material-symbols-outlined">delete_forever</span>
                Eliminar Dispositivo
            </button>
            <button class="modal-btn cancel" id="close-settings-modal">Cancelar</button>
        </div>
    </div>

    <!-- Modal Compartir (existente) -->
    <div class="modal-overlay" id="share-modal" style="display:none;">
        <div class="modal-content">
            <h3>Compartir Sitio</h3>
            <div id="shared-list" style="margin-bottom:15px;max-height:200px;overflow-y:auto;">
                <p style="color:var(--text-light);text-align:center;">Cargando...</p>
            </div>
            <div style="border-top:1px solid var(--border-color);padding-top:12px;margin-top:5px;">
                <input type="email" id="share-email" placeholder="correo@ejemplo.com" class="modal-input">
                <select id="share-role" class="modal-input">
                    <option value="INV">Invitado (solo ver)</option>
                    <option value="ADM">Administrador (control total)</option>
                </select>
                <button class="modal-btn primary" id="confirm-share">
                    <span class="material-symbols-outlined">person_add</span>
                    Compartir
                </button>
            </div>
            <button class="modal-btn cancel" id="close-share-modal">Cerrar</button>
        </div>
    </div>

    <!-- ========== MODAL PARA EDITAR NOMBRE DE ZONA ========== -->
    <div class="modal-overlay" id="edit-zone-modal" style="display:none;">
        <div class="modal-content">
            <h3>Editar nombre de zona</h3>
            <div class="modal-input-group">
                <label>Nombre de la zona</label>
                <input type="text" id="edit-zone-name-input" class="modal-input" placeholder="Ej: Puerta principal">
            </div>
            <div style="display:flex; gap:10px; margin-top:15px;">
                <button class="modal-btn primary" id="save-zone-name-btn" style="display:none;">
                    <span class="material-symbols-outlined">save</span>
                    Guardar
                </button>
                <button class="modal-btn cancel" id="close-zone-modal">Cancelar</button>
            </div>
        </div>
    </div>

</div>
