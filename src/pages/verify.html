<!-- Verificar Email -->
<div class="verify-content">
  <span class="material-symbols-outlined verify-icon">mark_email_unread</span>
  <h2>Verifica tu correo electrónico</h2>
  <p id="verify-message">
    Hemos enviado un enlace de verificación a tu correo electrónico. 
    Por favor, revisa tu bandeja de entrada y haz clic en el enlace para verificar tu cuenta.
  </p>
  <div class="verify-actions">
    <button class="auth-button primary-button" id="resend-verification-btn">
      <span class="button-text">Reenviar correo</span>
      <span class="button-loader" style="display: none;">
        <span class="loader"></span>
      </span>
    </button>
    <button class="auth-button secondary-button" id="check-verification-btn">
      <span class="button-text">Ya verifiqué mi correo</span>
      <span class="button-loader" style="display: none;">
        <span class="loader"></span>
      </span>
    </button>
    <button class="link-button" id="logout-from-verify">Cerrar sesión</button>
  </div>
</div>
